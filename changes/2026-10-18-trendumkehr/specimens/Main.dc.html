<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Frühwarnung und Ampel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#10355A}a:hover{color:#0A2440}
.cap{min-height:44px;font-size:14px;line-height:1.35;font-weight:500;color:#2F3740}
.cap b{font-weight:700}
.col{display:flex;flex-direction:column;gap:8px;width:360px}
.scr{width:360px;height:500px;box-sizing:border-box;padding:20px;display:flex;flex-direction:column;border-radius:6px;overflow:hidden}
.lv0{background:#D5E4F1;color:#10355A}
.lv1{background:#F5E1CB;color:#5A2C06}
.lv2{background:#EDA562;color:#3A1801}
.lv3{background:#8A380A;color:#FFF3E8}
.meta{font-size:14px;line-height:1.4;opacity:.85}
.h{margin:28px 0 0;font-size:64px;line-height:.98;font-weight:600;font-stretch:100%;letter-spacing:-0.01em}
.e1 .h{font-size:44px;font-weight:700}
.e2 .h{font-size:44px;font-weight:800;font-stretch:112%}
.e3 .h{font-size:42px;font-weight:900;font-stretch:125%}
.sub{margin-top:12px;font-size:16px;line-height:1.4}
.warn{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;font-stretch:112%}
.warn svg{flex:none}
.band{margin-top:14px;font-size:21px;font-weight:600}
.nums{margin-top:28px;padding-top:12px;border-top:1px solid color-mix(in srgb,currentColor 30%,transparent);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nl{font-size:13px;font-weight:500;opacity:.85}
.nv{margin-top:2px;font-size:28px;font-weight:600;font-stretch:88%;font-variant-numeric:tabular-nums}
.nu{font-size:13px;font-weight:500;opacity:.85}
.fade{margin-top:auto;font-size:12px;opacity:.6;text-align:center}
</style>
</helmet>
<div style="width: 1240px; height: 620px; box-sizing: border-box; padding: 32px 40px; display: flex; gap: 40px; background: #E3E6E9; font-family: 'Archivo', sans-serif">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="3">
<div class="col">
<div class="cap"><b>{{s.label}}</b><br>{{s.caption}}</div>
<div class="scr {{s.cls}}">
<div class="meta">{{s.meta}}</div>
<div class="h">{{s.headline}}</div>
<sc-if value="{{s.sub}}" hint-placeholder-val="{{true}}">
<div class="sub">{{s.sub}}</div>
</sc-if>
<sc-if value="{{s.warn}}" hint-placeholder-val="{{false}}">
<div class="warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg><span>{{s.warn}}</span></div>
</sc-if>
<div class="band">{{s.band}}</div>
<div class="nums">
<div><div class="nl">Trend</div><div class="nv">{{s.trend}}</div><div class="nu">kg</div></div>
<div><div class="nl">Gemessen</div><div class="nv">{{s.measured}}</div><div class="nu">kg</div></div>
<div><div class="nl">Tempo 4 Wochen</div><div class="nv">{{s.pace}}</div><div class="nu">kg pro Woche</div></div>
</div>
<div class="fade">… darunter wie bisher der Graph</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1240,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    var s17 = {
      meta: 'Letzte Messung 17.10. um 07:00 Uhr: 98,6 kg',
      trend: '97,75', measured: '98,6', pace: '−0,42',
      band: '4 Wochen: nimmt ab'
    };
    return {
      screens: [
        {
          label: '13.10.: Frühwarnung',
          caption: 'Seit 10.10. kein fallender Trend mehr; Ampel noch „nimmt ab“.',
          cls: 'lv1 e1', meta: 'Letzte Messung 13.10. um 07:00 Uhr: 98,1 kg',
          headline: 'Seit 3 Tagen kein Abnehmen', sub: 'Zuletzt abgenommen bis 10.10.', warn: '',
          band: '4 Wochen: nimmt ab', trend: '96,90', measured: '98,1', pace: '−0,73'
        },
        {
          label: 'Stagniert (Beispiel)',
          caption: 'Ein Stillstand über 4 Wochen, ohne deutlichen Anstieg.',
          cls: 'lv2 e2', meta: 'Letzte Messung 9.11. um 07:00 Uhr: 97,9 kg',
          headline: 'Seit 9 Tagen kein Abnehmen', sub: 'Zuletzt abgenommen bis 31.10.', warn: '',
          band: '4 Wochen: stagniert', trend: '98,02', measured: '97,9', pace: '−0,08'
        },
        Object.assign({}, s17, {
          label: '17.10.: Zunahme',
          caption: '„Nimmt zu“ wird die Überschrift; die Dauer rückt in den Satz darunter.',
          cls: 'lv2 e0', headline: 'Nimmt zu', sub: 'Seit 7 Tagen kein Abnehmen, zuletzt abgenommen bis 10.10.', warn: ''
        })
      ]
    };
  }
}
</script>
</body>
</html>
